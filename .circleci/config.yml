version: 2.1

orbs:
  gem: doximity/gem-publisher@0

executors:
  ruby:
    parameters:
      version:
        type: string
    resource_class: small
    docker:
      - image: cimg/ruby:<< parameters.version >>
        environment:
          BUNDLE_VERSION: "4.0.23"
  ruby-latest:
    resource_class: small
    docker:
      - image: cimg/ruby:3.4
        environment:
          BUNDLE_VERSION: "4.0.23"

# yaml anchor filters
master_only: &master_only
  filters:
    branches:
      only: master
    tags:
      ignore: /.*/
pr_only: &pr_only
  filters:
    branches:
      ignore: master
    tags:
      ignore: /.*/
version_tags_only: &version_tags_only
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v.*/

jobs:
  build:
    parameters:
      ruby_version:
        type: string
    executor:
      name: ruby
      version: << parameters.ruby_version >>
    steps:
      - checkout
      - run:
          name: Install Bundler specific version
          command: |
            gem install bundler --version "${BUNDLE_VERSION}" --force
            bundle config set --local path 'vendor/bundle'
      - restore_cache:
          keys:
            - v1-bundle-{{ checksum "Gemfile.lock" }}-
      - run:
          name: Install Ruby Dependencies
          command: bundle install # install every time so we don't have to package vendor/bundle with the gem
      - save_cache:
          key: v1-bundle-{{ checksum "Gemfile.lock" }}-
          paths:
            - vendor/bundle
      - run:
          name: Run Tests
          command: bundle exec rake ci:specs
      - store_test_results:
          name: Store test results
          path: tmp/test-results
      - run:
          name: Build documentation
          command: bundle exec rake ci:doc
      - store_artifacts:
          name: Saves documentation
          path: doc
      - persist_to_workspace:
          root: .
          paths:
            - vendor/bundle

workflows:
  version: 2

  trunk:
    jobs:
      - build:
          <<: *master_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]
      - gem/build:
          <<: *master_only
          executor: ruby-latest
          name: gem-build
          requires:
            - build

  pull-requests:
    jobs:
      - build:
          <<: *pr_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]
      - gem/build:
          <<: *pr_only
          executor: ruby-latest
          name: gem-build
          requires:
            - build
      - pre-release-approval:
          <<: *pr_only
          type: approval
          requires:
            - gem-build
      - gem/publish:
          <<: *pr_only
          name: gem-publish
          to_rubygems: true
          pre_release: true
          requires:
            - pre-release-approval
          context: artifact_publishing

  final-release:
    jobs:
      - build:
          <<: *version_tags_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]
      - gem/build:
          <<: *version_tags_only
          executor: ruby-latest
          name: gem-build
          requires:
            - build
      - gem/publish:
          <<: *version_tags_only
          name: gem-publish
          to_rubygems: true
          pre_release: false
          requires:
            - gem-build
          context: artifact_publishing
